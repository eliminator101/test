<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate SPCC - Link Manager</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .search-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .search-section input {
            flex: 1;
        }

        .links-list {
            display: grid;
            gap: 15px;
        }

        .link-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .link-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .link-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .link-url {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .link-url a {
            color: #667eea;
            text-decoration: none;
        }

        .link-url a:hover {
            text-decoration: underline;
        }

        .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .keyword-tag {
            background: #e0e7ff;
            color: #4c51bf;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .meta {
            font-size: 12px;
            color: #718096;
            margin-bottom: 12px;
        }

        .vote-section {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .vote-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vote-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 600;
        }

        .vote-btn.upvote {
            color: #48bb78;
        }

        .vote-btn.upvote:hover {
            background: #f0fff4;
            transform: scale(1.05);
        }

        .vote-btn.downvote {
            color: #f56565;
        }

        .vote-btn.downvote:hover {
            background: #fff5f5;
            transform: scale(1.05);
        }

        .vote-score {
            font-size: 18px;
            font-weight: bold;
            color: #4a5568;
            min-width: 50px;
            text-align: center;
        }

        .vote-status {
            font-size: 12px;
            color: #718096;
            margin-left: 10px;
            padding: 4px 8px;
            background: #edf2f7;
            border-radius: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .alert.success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }

        .alert.error {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }

        .alert.info {
            background: #bee3f8;
            color: #2c5282;
            display: block;
        }

        .name-input-section {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .current-user {
            background: #e0e7ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #4c51bf;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
        }

        .status-online {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-offline {
            background: #fed7d7;
            color: #742a2a;
        }

        /* Login Screen Styles */
        .login-screen {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .login-card h2 {
            margin: 20px 0;
            color: #333;
        }

        .login-card p {
            color: #666;
            margin-bottom: 30px;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .app-content {
            display: none;
        }

        .app-content.visible {
            display: block;
        }

        .header-bar {
            background: white;
            border-radius: 20px;
            padding: 15px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .logo h2 {
            color: #667eea;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .search-section {
                flex-direction: column;
            }
            
            .card {
                padding: 20px;
            }

            .vote-section {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen">
            <div class="card login-card">
                <h1>🏴‍☠️ Pirate SPCC</h1>
                <h2>Welcome Aboard!</h2>
                <p>Sign in with your Google account to share, search, and vote on links with the crew.</p>
                <div class="google-btn-container" id="googleSignInBtn"></div>
                <p style="font-size: 12px; color: #999; margin-top: 20px;">All data is saved in the cloud and shared with everyone.</p>
            </div>
        </div>

        <!-- Main App Content (hidden until login) -->
        <div id="appContent" class="app-content">
            <div class="header-bar">
                <div class="logo">
                    <h2>🏴‍☠️ Pirate SPCC</h2>
                </div>
                <div class="user-info" id="userInfo">
                    <!-- User info will be inserted here -->
                </div>
            </div>

            <div class="card">
                <div id="dbStatus" style="margin-bottom: 15px;"></div>

                <!-- Submit Form -->
                <div style="margin-bottom: 40px;">
                    <h2 style="margin-bottom: 20px; font-size: 20px;">Submit New Link</h2>
                    <div class="form-group">
                        <label>📌 Title *</label>
                        <input type="text" id="linkTitle" placeholder="Enter a descriptive title for this link">
                    </div>
                    <div class="form-group">
                        <label>🔗 URL *</label>
                        <input type="text" id="linkUrl" placeholder="https://example.com/awesome-page">
                    </div>
                    <div class="form-group">
                        <label>🏷️ Keywords * (separate with spaces or commas)</label>
                        <input type="text" id="linkKeywords" placeholder="javascript tutorial webdev react">
                    </div>
                    <button id="submitBtn">+ Add Link</button>
                    <div id="alert" class="alert"></div>
                </div>

                <!-- Search Section -->
                <div>
                    <h2 style="margin-bottom: 20px; font-size: 20px;">🔍 Search Links</h2>
                    <div class="search-section">
                        <input type="text" id="searchInput" placeholder="Search by title or keywords...">
                        <button id="searchBtn">Search</button>
                        <button id="resetBtn" style="background: #cbd5e0;">Reset</button>
                    </div>
                    
                    <!-- Results -->
                    <div id="results">
                        <h3 style="margin-bottom: 15px; font-size: 16px; color: #4a5568;">
                            <span id="resultCount"></span>
                        </h3>
                        <div id="linksList" class="links-list">
                            <div class="loading">Loading links from database...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Google OAuth Configuration
        // You need to replace this with your own Google Client ID
        // Get it from: https://console.cloud.google.com/apis/credentials
        // ============================================
        const GOOGLE_CLIENT_ID = '64733114747-ra62220io018kmui4u3sofo4vu8r16oh.apps.googleusercontent.com';
        
        // Supabase Configuration
        const SUPABASE_URL = 'https://urnbbsbnfrffqmoyvivw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVybmJic2JuZnJmZnFtb3l2aXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODI0NTYsImV4cCI6MjA5NDE1ODQ1Nn0.srfinvvX2ILO9_sVwP2TjZQucQYQ1tLJPZyGbOc2y4g';
        
        let links = [];
        let currentSearchQuery = '';
        let currentUser = null;  // Will store Google user info
        let isLoading = false;
        
        // Helper function to make Supabase requests
        async function supabaseRequest(endpoint, options = {}) {
            const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation',
                ...options.headers
            };
            
            const response = await fetch(url, { ...options, headers });
            
            if (!response.ok) {
                throw new Error(`Database error: ${response.status}`);
            }
            
            if (response.status === 204 || response.headers.get('content-length') === '0') {
                return { success: true };
            }
            
            try {
                return await response.json();
            } catch (e) {
                return { success: true };
            }
        }
        
        // Load links from database
        async function loadLinks() {
            showLoading(true);
            
            try {
                const data = await supabaseRequest('links?order=timestamp.desc');
                
                if (data && Array.isArray(data)) {
                    links = data;
                    updateDbStatus(true);
                    saveLinksToLocalBackup();
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Failed to load from database:', error);
                updateDbStatus(false);
                loadLocalBackup();
            }
            
            showLoading(false);
            displayLinks();
        }
        
        // Save a single link to database
        async function insertLink(link) {
            try {
                await supabaseRequest('links', {
                    method: 'POST',
                    body: JSON.stringify(link)
                });
                return true;
            } catch (error) {
                console.error('Failed to insert link:', error);
                return false;
            }
        }
        
        // Update a link in database (for votes)
        async function updateLink(linkId, updates) {
            try {
                await supabaseRequest(`links?id=eq.${linkId}`, {
                    method: 'PATCH',
                    body: JSON.stringify(updates)
                });
                return true;
            } catch (error) {
                console.error('Failed to update link:', error);
                return false;
            }
        }
        
        // Local backup functions
        function saveLinksToLocalBackup() {
            localStorage.setItem('link_manager_backup', JSON.stringify(links));
        }
        
        function loadLocalBackup() {
            const backup = localStorage.getItem('link_manager_backup');
            if (backup) {
                links = JSON.parse(backup);
                showAlert('Using local backup - database offline', 'info');
            } else {
                links = [];
                saveLinksToLocalBackup();
            }
        }
        
        // Update database status display
        function updateDbStatus(isOnline) {
            const statusDiv = document.getElementById('dbStatus');
            if (statusDiv) {
                if (isOnline) {
                    statusDiv.innerHTML = '<span class="status-badge status-online">✅ Cloud Storage Active</span> <span style="font-size: 12px;">All changes saved to cloud</span>';
                } else {
                    statusDiv.innerHTML = '<span class="status-badge status-offline">⚠️ Offline Mode</span> <span style="font-size: 12px;">Using local backup - check your connection</span>';
                }
            }
        }
        
        function showLoading(show) {
            isLoading = show;
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = show;
            }
        }
        
        function getVoteScore(link) {
            return (link.upvotes?.length || 0) - (link.downvotes?.length || 0);
        }
        
        function getUserVote(link) {
            if (!currentUser) return null;
            const userEmail = currentUser.email;
            if (link.upvotes?.includes(userEmail)) return 'up';
            if (link.downvotes?.includes(userEmail)) return 'down';
            return null;
        }
        
        async function upvoteLink(linkId) {
            if (!currentUser) {
                showAlert('Please sign in to vote', 'error');
                return false;
            }
            
            const link = links.find(l => l.id === linkId);
            if (!link) return false;
            
            if (!link.upvotes) link.upvotes = [];
            if (!link.downvotes) link.downvotes = [];
            
            const userEmail = currentUser.email;
            const alreadyUpvoted = link.upvotes.includes(userEmail);
            const alreadyDownvoted = link.downvotes.includes(userEmail);
            
            if (alreadyUpvoted) {
                link.upvotes = link.upvotes.filter(email => email !== userEmail);
                showAlert('Removed your upvote', 'success');
            } else {
                if (alreadyDownvoted) {
                    link.downvotes = link.downvotes.filter(email => email !== userEmail);
                }
                link.upvotes.push(userEmail);
                showAlert('✓ Upvoted!', 'success');
            }
            
            const updateSuccess = await updateLink(linkId, {
                upvotes: link.upvotes,
                downvotes: link.downvotes
            });
            
            if (!updateSuccess) {
                showAlert('Failed to save vote to cloud', 'error');
            }
            
            saveLinksToLocalBackup();
            displayLinks();
            return true;
        }
        
        async function downvoteLink(linkId) {
            if (!currentUser) {
                showAlert('Please sign in to vote', 'error');
                return false;
            }
            
            const link = links.find(l => l.id === linkId);
            if (!link) return false;
            
            if (!link.upvotes) link.upvotes = [];
            if (!link.downvotes) link.downvotes = [];
            
            const userEmail = currentUser.email;
            const alreadyDownvoted = link.downvotes.includes(userEmail);
            const alreadyUpvoted = link.upvotes.includes(userEmail);
            
            if (alreadyDownvoted) {
                link.downvotes = link.downvotes.filter(email => email !== userEmail);
                showAlert('Removed your downvote', 'success');
            } else {
                if (alreadyUpvoted) {
                    link.upvotes = link.upvotes.filter(email => email !== userEmail);
                }
                link.downvotes.push(userEmail);
                showAlert('▼ Downvoted!', 'success');
            }
            
            const updateSuccess = await updateLink(linkId, {
                upvotes: link.upvotes,
                downvotes: link.downvotes
            });
            
            if (!updateSuccess) {
                showAlert('Failed to save vote to cloud', 'error');
            }
            
            saveLinksToLocalBackup();
            displayLinks();
            return true;
        }
        
        async function addLink(title, url, keywordsText) {
            if (!currentUser) {
                showAlert('Please sign in to submit links', 'error');
                return false;
            }
            
            if (!title || !title.trim()) {
                showAlert('Please enter a title', 'error');
                return false;
            }
            
            if (!url || !url.trim()) {
                showAlert('Please enter a URL', 'error');
                return false;
            }
            
            if (!keywordsText || !keywordsText.trim()) {
                showAlert('Please enter at least one keyword', 'error');
                return false;
            }
            
            let cleanUrl = url.trim();
            if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
                cleanUrl = 'https://' + cleanUrl;
            }
            
            const keywords = keywordsText
                .split(/[ ,]+/)
                .filter(kw => kw.trim().length > 0)
                .map(kw => kw.toLowerCase().trim());
            
            if (keywords.length === 0) {
                showAlert('Please enter at least one valid keyword', 'error');
                return false;
            }
            
            const newLink = {
                id: Date.now().toString(),
                title: title.trim(),
                url: cleanUrl,
                keywords: keywords,
                timestamp: Date.now(),
                upvotes: [],
                downvotes: []
            };
            
            const insertSuccess = await insertLink(newLink);
            
            if (!insertSuccess) {
                showAlert('Failed to save to cloud', 'error');
                return false;
            }
            
            links.unshift(newLink);
            
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkKeywords').value = '';
            
            showAlert('✓ Link added successfully!', 'success');
            saveLinksToLocalBackup();
            displayLinks();
            
            return true;
        }
        
        function searchLinks(query) {
            if (!query || !query.trim()) {
                return [...links];
            }
            
            const searchTerms = query.toLowerCase().trim().split(/[ ,]+/);
            
            return links.filter(link => {
                const titleMatch = searchTerms.some(term => 
                    link.title.toLowerCase().includes(term)
                );
                
                const keywordMatch = searchTerms.some(term =>
                    link.keywords.some(keyword => keyword.includes(term))
                );
                
                return titleMatch || keywordMatch;
            });
        }
        
        function displayLinks() {
            const filteredLinks = searchLinks(currentSearchQuery);
            const sortedLinks = [...filteredLinks].sort((a, b) => {
                const scoreDiff = getVoteScore(b) - getVoteScore(a);
                if (scoreDiff !== 0) return scoreDiff;
                return b.timestamp - a.timestamp;
            });
            
            const linksListDiv = document.getElementById('linksList');
            const resultCountSpan = document.getElementById('resultCount');
            
            if (!linksListDiv) return;
            
            if (sortedLinks.length === 0) {
                linksListDiv.innerHTML = `
                    <div class="empty-state">
                        <p>🔍 No links found</p>
                        <p style="font-size: 14px; margin-top: 10px;">Be the first to submit a link!</p>
                    </div>
                `;
                if (resultCountSpan) resultCountSpan.textContent = '0 results';
                return;
            }
            
            if (resultCountSpan) {
                resultCountSpan.textContent = `${sortedLinks.length} result${sortedLinks.length !== 1 ? 's' : ''}`;
            }
            
            linksListDiv.innerHTML = sortedLinks.map(link => {
                const score = getVoteScore(link);
                const userVote = getUserVote(link);
                const upvoteCount = link.upvotes?.length || 0;
                const downvoteCount = link.downvotes?.length || 0;
                
                return `
                    <div class="link-item">
                        <div class="link-title">📌 ${escapeHtml(link.title)}</div>
                        <div class="link-url">
                            <a href="${escapeHtml(link.url)}" target="_blank">🔗 ${escapeHtml(link.url.substring(0, 70))}${link.url.length > 70 ? '...' : ''}</a>
                        </div>
                        <div class="keywords">
                            ${link.keywords.map(kw => `<span class="keyword-tag">#${escapeHtml(kw)}</span>`).join('')}
                        </div>
                        <div class="meta">📅 Added: ${new Date(link.timestamp).toLocaleString()} by ${escapeHtml(link.submitterName || 'Anonymous')}</div>
                        <div class="vote-section">
                            <div class="vote-buttons">
                                <button class="vote-btn upvote" data-action="upvote" data-id="${link.id}">👍 Upvote (${upvoteCount})</button>
                                <span class="vote-score">⭐ Score: ${score > 0 ? '+' + score : score}</span>
                                <button class="vote-btn downvote" data-action="downvote" data-id="${link.id}">👎 Downvote (${downvoteCount})</button>
                            </div>
                            ${userVote ? `<div class="vote-status">You ${userVote === 'up' ? '👍 upvoted' : '👎 downvoted'} this</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            if (alertDiv) {
                alertDiv.textContent = message;
                alertDiv.className = `alert ${type}`;
                setTimeout(() => {
                    alertDiv.className = 'alert';
                }, 3000);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Google Sign-In Handlers
        function handleGoogleSignIn(response) {
            if (response.credential) {
                const payload = parseJwt(response.credential);
                if (payload) {
                    currentUser = {
                        id: payload.sub,
                        email: payload.email,
                        name: payload.name,
                        picture: payload.picture
                    };
                    
                    // Save to localStorage to persist login
                    localStorage.setItem('google_user', JSON.stringify(currentUser));
                    
                    // Show app and hide login
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appContent').classList.add('visible');
                    updateUserInfoDisplay();
                    loadLinks();
                }
            }
        }
        
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error('JWT parse error:', error);
                return null;
            }
        }
        
        function updateUserInfoDisplay() {
            const userInfoDiv = document.getElementById('userInfo');
            if (userInfoDiv && currentUser) {
                userInfoDiv.innerHTML = `
                    <img src="${currentUser.picture}" class="user-avatar" alt="Avatar">
                    <span>${escapeHtml(currentUser.name)}</span>
                    <button id="signOutBtn" style="background: #ef4444; padding: 8px 16px;">Sign Out</button>
                `;
                
                document.getElementById('signOutBtn').addEventListener('click', signOut);
            }
        }
        
        function signOut() {
            currentUser = null;
            localStorage.removeItem('google_user');
            
            if (window.google && window.google.accounts) {
                google.accounts.id.disableAutoSelect();
            }
            
            // Show login screen
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').classList.remove('visible');
        }
        
        function initializeGoogleSignIn() {
            if (!window.google) {
                setTimeout(initializeGoogleSignIn, 100);
                return;
            }
            
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleSignIn,
                auto_select: false,
                cancel_on_tap_outside: false
            });
            
            google.accounts.id.renderButton(
                document.getElementById('googleSignInBtn'),
                { theme: 'outline', size: 'large', text: 'signin_with' }
            );
        }
        
        function checkExistingLogin() {
            const savedUser = localStorage.getItem('google_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContent').classList.add('visible');
                updateUserInfoDisplay();
                loadLinks();
            }
        }
        
        function setupEventListeners() {
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    addLink(
                        document.getElementById('linkTitle').value,
                        document.getElementById('linkUrl').value,
                        document.getElementById('linkKeywords').value
                    );
                });
            }
            
            const searchBtn = document.getElementById('searchBtn');
            if (searchBtn) {
                searchBtn.addEventListener('click', () => {
                    currentSearchQuery = document.getElementById('searchInput').value;
                    displayLinks();
                });
            }
            
            const resetBtn = document.getElementById('resetBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    document.getElementById('searchInput').value = '';
                    currentSearchQuery = '';
                    displayLinks();
                });
            }
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        currentSearchQuery = e.target.value;
                        displayLinks();
                    }
                });
            }
            
            const linksList = document.getElementById('linksList');
            if (linksList) {
                linksList.addEventListener('click', (e) => {
                    const upvoteBtn = e.target.closest('[data-action="upvote"]');
                    const downvoteBtn = e.target.closest('[data-action="downvote"]');
                    
                    if (upvoteBtn) upvoteLink(upvoteBtn.getAttribute('data-id'));
                    else if (downvoteBtn) downvoteLink(downvoteBtn.getAttribute('data-id'));
                });
            }
        }
        
        // Initialize
        function init() {
            setupEventListeners();
            checkExistingLogin();
            initializeGoogleSignIn();
        }
        
        init();
    </script>
</body>
</html>
